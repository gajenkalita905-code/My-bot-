<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura AI - Universal Chat Interface</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        aura: {
                            50: '#f0f4ff',
                            100: '#e0e8ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            900: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Custom scrollbar & mobile safety styles */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: -webkit-fill-available;
        }
        html {
            height: -webkit-fill-available;
        }
        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0.4);
            border-radius: 3px;
        }
        .markdown-body p { margin-bottom: 0.75rem; }
        .markdown-body pre { 
            background: #1e293b; 
            color: #f8fafc; 
            padding: 1rem; 
            border-radius: 0.5rem; 
            overflow-x: auto;
            margin: 0.75rem 0;
        }
        .markdown-body code { font-family: monospace; }
        .markdown-body ul { list-style-type: disc; margin-left: 1.5rem; }
        .markdown-body ol { list-style-type: decimal; margin-left: 1.5rem; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans flex flex-col antialiased">

    <!-- Fallback Loader -->
    <div id="loading" class="fixed inset-0 z-50 flex items-center justify-center bg-white dark:bg-slate-900">
        <div class="flex flex-col items-center space-y-4">
            <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-lg font-medium text-slate-600 dark:text-slate-300">Initializing Aura AI...</p>
        </div>
    </div>

    <!-- Main Application Wrapper -->
    <div id="app" class="flex flex-1 w-full relative overflow-hidden hidden">
        
        <!-- Sidebar Backdrop (Mobile) -->
        <div id="sidebarBackdrop" class="fixed inset-0 bg-slate-900/50 z-20 hidden md:hidden"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-30 w-72 bg-white dark:bg-slate-950 border-r border-slate-200 dark:border-slate-800 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col justify-between">
            <div class="p-4 flex flex-col h-full">
                <!-- Brand & New Chat -->
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center space-x-2">
                        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-lg">A</div>
                        <span class="text-xl font-bold bg-gradient-to-r from-indigo-500 to-purple-600 bg-clip-text text-transparent">Aura AI</span>
                    </div>
                    <button id="closeSidebarBtn" class="md:hidden text-slate-500 hover:text-slate-700 dark:hover:text-slate-300">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>

                <button id="newChatBtn" class="w-full flex items-center justify-center space-x-2 py-3 px-4 rounded-xl border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 font-medium transition-colors mb-4">
                    <i class="fa-solid fa-plus text-indigo-500"></i>
                    <span>New Chat</span>
                </button>

                <!-- Chat History List -->
                <div class="flex-1 overflow-y-auto chat-scroll space-y-1 pr-1" id="chatList">
                    <!-- Dynamic chat titles go here -->
                </div>

                <!-- Footer / Quick Settings -->
                <div class="pt-4 mt-auto border-t border-slate-200 dark:border-slate-800 space-y-2">
                    <button id="themeToggleBtn" class="w-full flex items-center justify-between px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-sm">
                        <span class="flex items-center space-x-2">
                            <i class="fa-solid fa-moon text-slate-500 dark:text-slate-400"></i>
                            <span>Dark Mode</span>
                        </span>
                        <div class="w-8 h-4 bg-slate-300 dark:bg-indigo-600 rounded-full relative p-0.5 transition-colors">
                            <div class="w-3 h-3 bg-white rounded-full transform dark:translate-x-4 transition-transform"></div>
                        </div>
                    </button>
                    <button id="openSettingsBtn" class="w-full flex items-center space-x-2 px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-sm">
                        <i class="fa-solid fa-gear text-slate-500 dark:text-slate-400"></i>
                        <span>Settings & API</span>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="flex-1 flex flex-col h-full w-full relative min-w-0">
            <!-- Header Bar -->
            <header class="h-14 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-4 bg-white/80 dark:bg-slate-900/80 backdrop-blur shrink-0">
                <div class="flex items-center space-x-3">
                    <button id="openSidebarBtn" class="md:hidden text-slate-500 hover:text-slate-700 dark:hover:text-slate-300">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                    <h2 id="currentChatTitle" class="font-medium text-slate-800 dark:text-slate-200 truncate max-w-[180px] sm:max-w-md">New Chat</h2>
                </div>
                <div class="flex items-center space-x-2">
                    <button id="editSystemPromptBtn" class="text-xs border border-slate-300 dark:border-slate-700 px-2.5 py-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center space-x-1">
                        <i class="fa-solid fa-sliders"></i>
                        <span class="hidden sm:inline">System Prompt</span>
                    </button>
                </div>
            </header>

            <!-- Chat Messages Area -->
            <div id="chatContainer" class="flex-1 overflow-y-auto chat-scroll p-4 md:p-6 space-y-6">
                <!-- Chat messages will render here -->
            </div>

            <!-- Image Preview Container -->
            <div id="imagePreviewContainer" class="px-4 pt-2 hidden flex items-center space-x-2">
                <div class="relative inline-block">
                    <img id="imagePreview" src="" class="h-16 w-16 object-cover rounded-lg border border-slate-300 dark:border-slate-700">
                    <button id="removeImageBtn" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <span class="text-xs text-slate-500">(Image will be attached to context)</span>
            </div>

            <!-- Input Bar -->
            <div class="p-3 sm:p-4 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 shrink-0">
                <div class="max-w-4xl mx-auto relative flex items-center bg-slate-100 dark:bg-slate-800 rounded-2xl p-2 border border-slate-200 dark:border-slate-700 focus-within:ring-2 focus-within:ring-indigo-500">
                    
                    <!-- File Upload Button -->
                    <label for="imageUpload" class="cursor-pointer p-2 text-slate-500 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">
                        <i class="fa-solid fa-paperclip text-lg"></i>
                        <input type="file" id="imageUpload" accept="image/*" class="hidden">
                    </label>

                    <!-- Voice Input Button -->
                    <button id="voiceInputBtn" class="p-2 text-slate-500 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">
                        <i class="fa-solid fa-microphone text-lg" id="micIcon"></i>
                    </button>

                    <!-- Textarea Input -->
                    <textarea id="userInput" rows="1" placeholder="Message Aura..." class="flex-1 bg-transparent border-0 focus:outline-none resize-none px-2 max-h-32 text-slate-800 dark:text-slate-100 placeholder-slate-400 text-sm sm:text-base"></textarea>

                    <!-- Submit Button -->
                    <button id="sendMessageBtn" class="p-2 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 disabled:opacity-50 transition-colors shrink-0">
                        <i class="fa-solid fa-paper-plane text-sm"></i>
                    </button>
                </div>
                <div class="text-[10px] text-center text-slate-400 dark:text-slate-500 mt-2">
                    Aura can make mistakes. Aura cannot generate images directly.
                </div>
            </div>
        </main>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settingsModal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center hidden p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-xl">
            <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">Settings</h3>
            <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">OpenRouter API Key</label>
                <input type="password" id="apiKeyInput" placeholder="sk-or-v1-..." class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Model Name</label>
                <input type="text" id="modelInput" placeholder="deepseek/deepseek-r1:free" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button id="closeSettingsBtn" class="px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 text-xs font-medium hover:bg-slate-100 dark:hover:bg-slate-800">Cancel</button>
                <button id="saveSettingsBtn" class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-xs font-medium hover:bg-indigo-700">Save</button>
            </div>
        </div>
    </div>

    <!-- SYSTEM PROMPT MODAL -->
    <div id="systemPromptModal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center hidden p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-xl">
            <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">System Instructions</h3>
            <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Define Aura's Behavior & Persona</label>
                <textarea id="systemPromptInput" rows="5" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"></textarea>
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button id="closeSystemPromptBtn" class="px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 text-xs font-medium hover:bg-slate-100 dark:hover:bg-slate-800">Cancel</button>
                <button id="saveSystemPromptBtn" class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-xs font-medium hover:bg-indigo-700">Save Instructions</button>
            </div>
        </div>
    </div>

    <!-- SCRIPTS AT THE VERY END OF BODY -->
    <script>
        // --- APP STATE & INITIALIZATION ---
        const DEFAULT_MODEL = 'deepseek/deepseek-r1:free';
        const DEFAULT_SYSTEM_PROMPT = 'You are Aura, a highly intelligent, empathetic, and helpful AI assistant created to assist users with clarity and precision. You cannot generate or create images directly.';

        let state = {
            apiKey: localStorage.getItem('aura_api_key') || '',
            model: localStorage.getItem('aura_model') || DEFAULT_MODEL,
            systemPrompt: localStorage.getItem('aura_system_prompt') || DEFAULT_SYSTEM_PROMPT,
            theme: localStorage.getItem('aura_theme') || 'light',
            chats: JSON.parse(localStorage.getItem('aura_chats')) || [],
            currentChatId: localStorage.getItem('aura_current_chat_id') || null,
            attachedImageBase64: null,
            isGenerating: false,
            recognition: null
        };

        // DOM Elements Safely Handled
        const elements = {
            loading: document.getElementById('loading'),
            app: document.getElementById('app'),
            sidebar: document.getElementById('sidebar'),
            sidebarBackdrop: document.getElementById('sidebarBackdrop'),
            openSidebarBtn: document.getElementById('openSidebarBtn'),
            closeSidebarBtn: document.getElementById('closeSidebarBtn'),
            chatList: document.getElementById('chatList'),
            chatContainer: document.getElementById('chatContainer'),
            newChatBtn: document.getElementById('newChatBtn'),
            currentChatTitle: document.getElementById('currentChatTitle'),
            userInput: document.getElementById('userInput'),
            sendMessageBtn: document.getElementById('sendMessageBtn'),
            themeToggleBtn: document.getElementById('themeToggleBtn'),
            settingsModal: document.getElementById('settingsModal'),
            openSettingsBtn: document.getElementById('openSettingsBtn'),
            closeSettingsBtn: document.getElementById('closeSettingsBtn'),
            saveSettingsBtn: document.getElementById('saveSettingsBtn'),
            apiKeyInput: document.getElementById('apiKeyInput'),
            modelInput: document.getElementById('modelInput'),
            systemPromptModal: document.getElementById('systemPromptModal'),
            editSystemPromptBtn: document.getElementById('editSystemPromptBtn'),
            closeSystemPromptBtn: document.getElementById('closeSystemPromptBtn'),
            saveSystemPromptBtn: document.getElementById('saveSystemPromptBtn'),
            systemPromptInput: document.getElementById('systemPromptInput'),
            imageUpload: document.getElementById('imageUpload'),
            imagePreviewContainer: document.getElementById('imagePreviewContainer'),
            imagePreview: document.getElementById('imagePreview'),
            removeImageBtn: document.getElementById('removeImageBtn'),
            voiceInputBtn: document.getElementById('voiceInputBtn'),
            micIcon: document.getElementById('micIcon')
        };

        // Core Init
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            initSpeechRecognition();
            if (state.chats.length === 0) {
                createNewChat();
            } else if (!state.currentChatId || !state.chats.find(c => c.id === state.currentChatId)) {
                state.currentChatId = state.chats[0].id;
            }
            
            renderChatList();
            renderMessages();

            // Hide Loader & Show App
            if (elements.loading) elements.loading.style.display = 'none';
            if (elements.app) elements.app.classList.remove('hidden');
        });

        // --- PERSISTENCE UTILS ---
        function saveToStorage() {
            try {
                localStorage.setItem('aura_api_key', state.apiKey);
                localStorage.setItem('aura_model', state.model);
                localStorage.setItem('aura_system_prompt', state.systemPrompt);
                localStorage.setItem('aura_theme', state.theme);
                localStorage.setItem('aura_chats', JSON.stringify(state.chats));
                localStorage.setItem('aura_current_chat_id', state.currentChatId);
            } catch (e) {
                console.error("Storage save failed:", e);
            }
        }

        // --- THEME ENGINE ---
        function initTheme() {
            if (state.theme === 'dark' || (!('aura_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                state.theme = 'dark';
            } else {
                document.documentElement.classList.remove('dark');
                state.theme = 'light';
            }
        }

        elements.themeToggleBtn.addEventListener('click', () => {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            initTheme();
            saveToStorage();
        });

        // --- SIDEBAR NAVIGATION (MOBILE SAFE) ---
        elements.openSidebarBtn.addEventListener('click', () => {
            elements.sidebar.classList.remove('-translate-x-full');
            elements.sidebarBackdrop.classList.remove('hidden');
        });

        function closeSidebar() {
            elements.sidebar.classList.add('-translate-x-full');
            elements.sidebarBackdrop.classList.add('hidden');
        }

        elements.closeSidebarBtn.addEventListener('click', closeSidebar);
        elements.sidebarBackdrop.addEventListener('click', closeSidebar);

        // --- CHAT MANAGEMENT ---
        function createNewChat() {
            const newChat = {
                id: 'chat_' + Date.now(),
                title: 'New Chat',
                messages: []
            };
            state.chats.unshift(newChat);
            state.currentChatId = newChat.id;
            saveToStorage();
            renderChatList();
            renderMessages();
            closeSidebar();
        }

        elements.newChatBtn.addEventListener('click', createNewChat);

        function getCurrentChat() {
            return state.chats.find(c => c.id === state.currentChatId);
        }

        function renderChatList() {
            elements.chatList.innerHTML = '';
            state.chats.forEach(chat => {
                const isActive = chat.id === state.currentChatId;
                const item = document.createElement('div');
                item.className = `group flex items-center justify-between p-2.5 rounded-xl cursor-pointer text-sm transition-colors ${isActive ? 'bg-indigo-50 dark:bg-slate-800/80 text-indigo-600 dark:text-indigo-400 font-medium' : 'hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300'}`;
                
                item.innerHTML = `
                    <div class="flex items-center space-x-2 truncate flex-1 mr-2">
                        <i class="fa-regular fa-message text-xs opacity-70"></i>
                        <span class="truncate">${escapeHtml(chat.title)}</span>
                    </div>
                    <div class="flex items-center space-x-1 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="renameChat('${chat.id}', event)" class="p-1 hover:text-indigo-600 text-slate-400"><i class="fa-solid fa-pen text-xs"></i></button>
                        <button onclick="deleteChat('${chat.id}', event)" class="p-1 hover:text-red-500 text-slate-400"><i class="fa-solid fa-trash text-xs"></i></button>
                    </div>
                `;

                item.addEventListener('click', () => {
                    state.currentChatId = chat.id;
                    saveToStorage();
                    renderChatList();
                    renderMessages();
                    closeSidebar();
                });

                elements.chatList.appendChild(item);
            });
        }

        window.renameChat = function(id, event) {
            event.stopPropagation();
            const chat = state.chats.find(c => c.id === id);
            if (!chat) return;
            const newTitle = prompt("Enter new title:", chat.title);
            if (newTitle && newTitle.trim() !== '') {
                chat.title = newTitle.trim();
                saveToStorage();
                renderChatList();
                if (id === state.currentChatId) elements.currentChatTitle.textContent = chat.title;
            }
        };

        window.deleteChat = function(id, event) {
            event.stopPropagation();
            if (confirm("Delete this conversation?")) {
                state.chats = state.chats.filter(c => c.id !== id);
                if (state.chats.length === 0) {
                    createNewChat();
                } else {
                    if (state.currentChatId === id) state.currentChatId = state.chats[0].id;
                    saveToStorage();
                    renderChatList();
                    renderMessages();
                }
            }
        };

        // --- RENDER MESSAGES ---
        function renderMessages() {
            const chat = getCurrentChat();
            if (!chat) return;

            elements.currentChatTitle.textContent = chat.title;
            elements.chatContainer.innerHTML = '';

            if (chat.messages.length === 0) {
                elements.chatContainer.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-center p-6 space-y-3">
                        <div class="w-16 h-16 rounded-2xl bg-indigo-100 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-3xl font-bold">A</div>
                        <h3 class="text-xl font-bold text-slate-800 dark:text-slate-100">Meet Aura</h3>
                        <p class="text-sm text-slate-500 dark:text-slate-400 max-w-sm">How can I assist you today? Feel free to ask questions, write code, or send dynamic prompts.</p>
                    </div>
                `;
                return;
            }

            chat.messages.forEach(msg => {
                appendMessageToDOM(msg.role, msg.content, msg.image);
            });

            scrollToBottom();
        }

        function appendMessageToDOM(role, content, image = null) {
            const isUser = role === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full ${isUser ? 'justify-end' : 'justify-start'}`;

            const msgBubble = document.createElement('div');
            msgBubble.className = `max-w-[85%] sm:max-w-[75%] rounded-2xl p-4 shadow-sm text-sm sm:text-base ${
                isUser 
                ? 'bg-indigo-600 text-white rounded-br-none' 
                : 'bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700/60 rounded-bl-none'
            }`;

            let htmlContent = '';
            if (image) {
                htmlContent += `<img src="${image}" class="max-h-48 rounded-lg mb-2 border border-slate-300 dark:border-slate-600 object-cover">`;
            }

            if (isUser) {
                htmlContent += `<div>${escapeHtml(content).replace(/\n/g, '<br>')}</div>`;
            } else {
                htmlContent += `<div class="markdown-body">${marked.parse(content || '')}</div>`;
            }

            msgBubble.innerHTML = htmlContent;
            wrapper.appendChild(msgBubble);
            elements.chatContainer.appendChild(wrapper);
            scrollToBottom();

            return msgBubble;
        }

        function scrollToBottom() {
            elements.chatContainer.scrollTop = elements.chatContainer.scrollHeight;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // --- VOICE RECOGNITION FEATURE ---
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                state.recognition = new SpeechRecognition();
                state.recognition.continuous = false;
                state.recognition.interimResults = false;

                state.recognition.onstart = () => {
                    elements.micIcon.classList.remove('fa-microphone');
                    elements.micIcon.classList.add('fa-spinner', 'animate-spin', 'text-red-500');
                };

                state.recognition.onresult = (e) => {
                    const transcript = e.results[0][0].transcript;
                    elements.userInput.value += (elements.userInput.value ? ' ' : '') + transcript;
                };

                state.recognition.onend = () => {
                    elements.micIcon.classList.remove('fa-spinner', 'animate-spin', 'text-red-500');
                    elements.micIcon.classList.add('fa-microphone');
                };

                elements.voiceInputBtn.addEventListener('click', () => {
                    if (elements.micIcon.classList.contains('animate-spin')) {
                        state.recognition.stop();
                    } else {
                        state.recognition.start();
                    }
                });
            } else {
                elements.voiceInputBtn.style.display = 'none'; // Speech recognition not supported
            }
        }

        // --- FILE & IMAGE HANDLING ---
        elements.imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    state.attachedImageBase64 = evt.target.result;
                    elements.imagePreview.src = evt.target.result;
                    elements.imagePreviewContainer.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        elements.removeImageBtn.addEventListener('click', () => {
            state.attachedImageBase64 = null;
            elements.imagePreviewContainer.classList.add('hidden');
            elements.imageUpload.value = '';
        });

        // --- OPENROUTER STREAMING ENGINE ---
        async function sendMessage() {
            const text = elements.userInput.value.trim();
            const image = state.attachedImageBase64;

            if ((!text && !image) || state.isGenerating) return;

            if (!state.apiKey) {
                alert("Please configure your OpenRouter API Key in Settings first.");
                openSettingsModal();
                return;
            }

            const chat = getCurrentChat();
            if (!chat) return;

            // Auto title generated from first user query
            if (chat.messages.length === 0 && text) {
                chat.title = text.slice(0, 25) + (text.length > 25 ? '...' : '');
                renderChatList();
            }

            // Append User Message to State
            const userMsg = { role: 'user', content: text, image: image };
            chat.messages.push(userMsg);
            appendMessageToDOM('user', text, image);

            // Reset Input UI
            elements.userInput.value = '';
            elements.userInput.style.height = 'auto';
            state.attachedImageBase64 = null;
            elements.imagePreviewContainer.classList.add('hidden');
            elements.imageUpload.value = '';

            // Setup Assistant Response Container
            state.isGenerating = true;
            elements.sendMessageBtn.disabled = true;

            const assistantMsgBubble = appendMessageToDOM('assistant', '');
            const markdownContainer = assistantMsgBubble.querySelector('.markdown-body');
            markdownContainer.innerHTML = '<span class="inline-block w-2 h-4 bg-slate-400 animate-pulse"></span>';

            // Prepare Payload
            const apiMessages = [
                { role: 'system', content: state.systemPrompt }
            ];

            chat.messages.forEach(m => {
                if (m.image) {
                    // Vision format for supporting models
                    apiMessages.push({
                        role: m.role,
                        content: [
                            { type: "text", text: m.content || "" },
                            { type: "image_url", image_url: { url: m.image } }
                        ]
                    });
                } else {
                    apiMessages.push({ role: m.role, content: m.content });
                }
            });

            let fullResponseText = '';

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${state.apiKey}`,
                        'HTTP-Referer': window.location.href,
                        'X-Title': 'Aura AI',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: state.model,
                        messages: apiMessages,
                        stream: true
                    })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error?.message || `API Error: ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        const trimmedLine = line.trim();
                        if (trimmedLine.startsWith('data: ')) {
                            const dataStr = trimmedLine.replace('data: ', '');
                            if (dataStr === '[DONE]') break;

                            try {
                                const parsed = JSON.parse(dataStr);
                                const token = parsed.choices[0]?.delta?.content || '';
                                fullResponseText += token;
                                markdownContainer.innerHTML = marked.parse(fullResponseText);
                                scrollToBottom();
                            } catch (e) {
                                // Skip broken parse chunks
                            }
                        }
                    }
                }

                chat.messages.push({ role: 'assistant', content: fullResponseText });
                saveToStorage();

            } catch (err) {
                console.error("Stream generation error:", err);
                markdownContainer.innerHTML = `<span class="text-red-500 font-medium"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Error: ${escapeHtml(err.message)}</span>`;
            } finally {
                state.isGenerating = false;
                elements.sendMessageBtn.disabled = false;
            }
        }

        // --- INPUT EVENT LISTENERS ---
        elements.sendMessageBtn.addEventListener('click', sendMessage);

        elements.userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Dynamic Textarea Auto-height Adjustment
        elements.userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // --- MODAL CONTROLS ---
        function openSettingsModal() {
            elements.apiKeyInput.value = state.apiKey;
            elements.modelInput.value = state.model;
            elements.settingsModal.classList.remove('hidden');
        }

        elements.openSettingsBtn.addEventListener('click', openSettingsModal);
        elements.closeSettingsBtn.addEventListener('click', () => elements.settingsModal.classList.add('hidden'));
        elements.saveSettingsBtn.addEventListener('click', () => {
            state.apiKey = elements.apiKeyInput.value.trim();
            state.model = elements.modelInput.value.trim() || DEFAULT_MODEL;
            saveToStorage();
            elements.settingsModal.classList.add('hidden');
        });

        // System Prompt Modal Controls
        elements.editSystemPromptBtn.addEventListener('click', () => {
            elements.systemPromptInput.value = state.systemPrompt;
            elements.systemPromptModal.classList.remove('hidden');
        });
        elements.closeSystemPromptBtn.addEventListener('click', () => elements.systemPromptModal.classList.add('hidden'));
        elements.saveSystemPromptBtn.addEventListener('click', () => {
            state.systemPrompt = elements.systemPromptInput.value.trim() || DEFAULT_SYSTEM_PROMPT;
            saveToStorage();
            elements.systemPromptModal.classList.add('hidden');
        });
    </script>
</body>
</html>
