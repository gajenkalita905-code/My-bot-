<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aura AI Chat</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Marked.js for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Tailwind Configuration for Dark Mode -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            geminiBgLight: '#f8f9fa',
            geminiSidebarLight: '#f0f4f9',
            geminiBgDark: '#131314',
            geminiSidebarDark: '#1e1f20',
            geminiInputDark: '#282a2c'
          }
        }
      }
    }
  </script>

  <style>
    /* Prevent layout shifting on mobile */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    
    /* Code block styling for Markdown output */
    pre {
      background-color: #1e1e1e;
      color: #d4d4d4;
      padding: 1rem;
      border-radius: 0.5rem;
      overflow-x: auto;
      margin-top: 0.5rem;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
    }
    code {
      font-family: monospace;
    }
    .dark pre {
      background-color: #0d0d0d;
    }
    
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #c5c7c8;
      border-radius: 3px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #444746;
    }
  </style>
</head>
<body class="bg-geminiBgLight dark:bg-geminiBgDark text-gray-800 dark:text-gray-200 transition-colors duration-200 antialiased">

  <!-- Fallback Loader -->
  <div id="loading" class="fixed inset-0 flex flex-col items-center justify-center bg-white dark:bg-geminiBgDark z-50">
    <div class="w-10 h-10 border-4 border-purple-500 border-t-transparent rounded-full animate-spin mb-4"></div>
    <div class="text-lg font-medium text-gray-600 dark:text-gray-300">Loading Aura...</div>
  </div>

  <!-- Main Application Container -->
  <div id="app" class="hidden flex h-full w-full overflow-hidden relative">

    <!-- Mobile Sidebar Backdrop -->
    <div id="sidebarBackdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-30 w-72 bg-geminiSidebarLight dark:bg-geminiSidebarDark flex flex-col transition-transform duration-300 transform -translate-x-full md:translate-x-0 border-r border-gray-200 dark:border-gray-800">
      
      <!-- New Chat Button & Hide Sidebar -->
      <div class="p-4 flex items-center justify-between">
        <button onclick="createNewChat()" class="flex-1 flex items-center gap-3 px-4 py-3 bg-gray-200/70 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 rounded-full text-sm font-medium transition-colors">
          <svg class="w-5 h-5 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          New Chat
        </button>
        <button onclick="toggleSidebar()" class="md:hidden p-2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <!-- Chat History List -->
      <div class="flex-1 overflow-y-auto px-3 py-2 space-y-1" id="chatList">
        <!-- Rendered dynamically -->
      </div>

      <!-- Sidebar Footer / Controls -->
      <div class="p-3 border-t border-gray-200 dark:border-gray-800 space-y-1">
        <button onclick="openSettingsModal()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-200/60 dark:hover:bg-gray-800 text-sm">
          <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          Settings
        </button>
        
        <button onclick="toggleDarkMode()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-200/60 dark:hover:bg-gray-800 text-sm">
          <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
          Toggle Dark Mode
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full min-w-0 bg-geminiBgLight dark:bg-geminiBgDark">
      
      <!-- Top Navbar -->
      <header class="h-14 border-b border-gray-200/50 dark:border-gray-800/50 flex items-center justify-between px-4">
        <div class="flex items-center gap-3">
          <button onclick="toggleSidebar()" class="md:hidden p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-800">
            <svg class="w-6 h-6 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
          </button>
          <span class="font-semibold text-lg tracking-tight bg-gradient-to-r from-purple-500 via-pink-500 to-blue-500 bg-clip-text text-transparent">Aura AI</span>
        </div>
        <div class="text-xs text-gray-500 dark:text-gray-400 truncate max-w-[150px] sm:max-w-none" id="currentModelDisplay">
          <!-- Model name rendered here -->
        </div>
      </header>

      <!-- Chat Messages Container -->
      <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 max-w-4xl mx-auto w-full">
        <!-- Messages rendered dynamically -->
      </div>

      <!-- Input Area Container (Mobile Sticky Bottom Safe) -->
      <div class="p-3 md:p-4 border-t border-gray-200/40 dark:border-gray-800/40 bg-geminiBgLight dark:bg-geminiBgDark">
        <div class="max-w-4xl mx-auto">
          <form onsubmit="handleFormSubmit(event)" class="relative flex items-center">
            <textarea 
              id="userInput" 
              rows="1" 
              placeholder="Ask Aura..." 
              onkeydown="handleKeyDown(event)"
              oninput="autoResizeTextarea(this)"
              class="w-full pl-4 pr-12 py-3 bg-gray-100 dark:bg-geminiInputDark text-gray-900 dark:text-gray-100 rounded-2xl resize-none focus:outline-none focus:ring-2 focus:ring-purple-500 border border-transparent dark:border-gray-700/50 max-h-48 text-sm md:text-base"
            ></textarea>
            <button 
              type="submit" 
              id="sendBtn"
              class="absolute right-2 p-2 text-purple-600 dark:text-purple-400 hover:bg-purple-50 dark:hover:bg-gray-700 rounded-full transition-colors disabled:opacity-40 disabled:hover:bg-transparent"
            >
              <svg class="w-5 h-5 transform rotate-90" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>
            </button>
          </form>
          <div class="text-[10px] text-center text-gray-400 dark:text-gray-500 mt-2">
            Aura AI may display inaccurate info, so double-check responses.
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-geminiSidebarDark rounded-2xl max-w-md w-full p-6 space-y-4 shadow-xl border border-gray-200 dark:border-gray-800">
      <h3 class="text-lg font-semibold text-gray-900 dark:text-gray-100">Settings</h3>
      
      <div>
        <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">OpenRouter API Key</label>
        <input type="password" id="apiKeyInput" class="w-full px-3 py-2 bg-gray-50 dark:bg-geminiInputDark border border-gray-300 dark:border-gray-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="sk-or-v1-..." />
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Model Name</label>
        <input type="text" id="modelInput" class="w-full px-3 py-2 bg-gray-50 dark:bg-geminiInputDark border border-gray-300 dark:border-gray-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="deepseek/deepseek-r1:free" />
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">System Prompt</label>
        <textarea id="systemPromptInput" rows="3" class="w-full px-3 py-2 bg-gray-50 dark:bg-geminiInputDark border border-gray-300 dark:border-gray-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 resize-none" placeholder="Your name is Aura, a helpful AI assistant."></textarea>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeSettingsModal()" class="px-4 py-2 text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg">Cancel</button>
        <button onclick="saveSettings()" class="px-4 py-2 text-sm bg-purple-600 hover:bg-purple-700 text-white rounded-lg font-medium">Save</button>
      </div>
    </div>
  </div>

  <!-- SCRIPT PLACED EXCLUSIVELY AT VERY END OF BODY -->
  <script>
    // State Initialization
    const STATE_KEY = 'aura_app_state_v1';
    let appState = {
      apiKey: '',
      model: 'deepseek/deepseek-r1:free',
      systemPrompt: 'Your name is Aura, a highly intelligent, friendly, and respectful AI assistant.',
      darkMode: false,
      currentChatId: null,
      chats: []
    };

    let isGenerating = false;

    // Initialization Sequence
    window.addEventListener('DOMContentLoaded', () => {
      try {
        loadState();
        applyDarkMode();
        
        if (appState.chats.length === 0) {
          createNewChat(false);
        } else if (!appState.currentChatId && appState.chats.length > 0) {
          appState.currentChatId = appState.chats[0].id;
        }

        renderSidebar();
        renderMessages();
        updateModelDisplay();

        // Reveal App, Remove Loader
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
      } catch (err) {
        console.error('Initialization Error:', err);
        alert('Failed to initialize application. Resetting state.');
        localStorage.removeItem(STATE_KEY);
        window.location.reload();
      }
    });

    // LocalStorage Management
    function loadState() {
      const saved = localStorage.getItem(STATE_KEY);
      if (saved) {
        try {
          appState = { ...appState, ...JSON.parse(saved) };
        } catch (e) {
          console.error("Failed to parse local storage state", e);
        }
      }
    }

    function saveState() {
      localStorage.setItem(STATE_KEY, JSON.stringify(appState));
    }

    // Dark Mode Toggle
    function toggleDarkMode() {
      appState.darkMode = !appState.darkMode;
      applyDarkMode();
      saveState();
    }

    function applyDarkMode() {
      if (appState.darkMode) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }

    // Sidebar Mobile Controls
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebarBackdrop');
      sidebar.classList.toggle('-translate-x-full');
      backdrop.classList.toggle('hidden');
    }

    // Chat Management
    function createNewChat(triggerRender = true) {
      const newChat = {
        id: Date.now().toString(),
        title: 'New Chat',
        messages: []
      };
      appState.chats.unshift(newChat);
      appState.currentChatId = newChat.id;
      saveState();
      
      if (triggerRender) {
        renderSidebar();
        renderMessages();
      }
    }

    function selectChat(id) {
      appState.currentChatId = id;
      saveState();
      renderSidebar();
      renderMessages();
      if (window.innerWidth < 768) {
        toggleSidebar();
      }
    }

    function deleteChat(id, event) {
      event.stopPropagation();
      appState.chats = appState.chats.filter(c => c.id !== id);
      if (appState.currentChatId === id) {
        appState.currentChatId = appState.chats.length > 0 ? appState.chats[0].id : null;
      }
      if (!appState.currentChatId) {
        createNewChat(false);
      }
      saveState();
      renderSidebar();
      renderMessages();
    }

    function renameChat(id, event) {
      event.stopPropagation();
      const chat = appState.chats.find(c => c.id === id);
      if (!chat) return;
      const newTitle = prompt('Enter new title:', chat.title);
      if (newTitle && newTitle.trim()) {
        chat.title = newTitle.trim();
        saveState();
        renderSidebar();
      }
    }

    // Settings Modal
    function openSettingsModal() {
      document.getElementById('apiKeyInput').value = appState.apiKey || '';
      document.getElementById('modelInput').value = appState.model || 'deepseek/deepseek-r1:free';
      document.getElementById('systemPromptInput').value = appState.systemPrompt || '';
      document.getElementById('settingsModal').classList.remove('hidden');
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.add('hidden');
    }

    function saveSettings() {
      appState.apiKey = document.getElementById('apiKeyInput').value.trim();
      appState.model = document.getElementById('modelInput').value.trim() || 'deepseek/deepseek-r1:free';
      appState.systemPrompt = document.getElementById('systemPromptInput').value.trim();
      saveState();
      updateModelDisplay();
      closeSettingsModal();
    }

    function updateModelDisplay() {
      document.getElementById('currentModelDisplay').innerText = appState.model;
    }

    // UI Rendering Functions
    function renderSidebar() {
      const container = document.getElementById('chatList');
      container.innerHTML = '';

      appState.chats.forEach(chat => {
        const isActive = chat.id === appState.currentChatId;
        const el = document.createElement('div');
        el.className = `group flex items-center justify-between px-3 py-2.5 rounded-xl cursor-pointer text-sm transition-colors ${
          isActive 
            ? 'bg-purple-100/70 dark:bg-gray-800 text-purple-600 dark:text-purple-400 font-medium' 
            : 'hover:bg-gray-200/50 dark:hover:bg-gray-800/50 text-gray-700 dark:text-gray-300'
        }`;
        el.onclick = () => selectChat(chat.id);

        el.innerHTML = `
          <div class="flex items-center gap-3 truncate pr-2">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
            <span class="truncate">${escapeHtml(chat.title)}</span>
          </div>
          <div class="hidden group-hover:flex items-center gap-1 shrink-0">
            <button onclick="renameChat('${chat.id}', event)" class="p-1 hover:text-purple-500"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>
            <button onclick="deleteChat('${chat.id}', event)" class="p-1 hover:text-red-500"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
          </div>
        `;
        container.appendChild(el);
      });
    }

    function renderMessages() {
      const container = document.getElementById('messagesContainer');
      container.innerHTML = '';

      const currentChat = appState.chats.find(c => c.id === appState.currentChatId);
      if (!currentChat || currentChat.messages.length === 0) {
        container.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-center p-6 text-gray-400">
            <div class="text-4xl mb-3">✦</div>
            <h2 class="text-2xl font-semibold mb-2 text-gray-700 dark:text-gray-200">Hi, I'm Aura</h2>
            <p class="text-sm max-w-sm">How can I help you today? Add your OpenRouter API key in settings to get started.</p>
          </div>
        `;
        return;
      }

      currentChat.messages.forEach(msg => {
        container.appendChild(createMessageNode(msg.role, msg.content));
      });

      scrollToBottom();
    }

    function createMessageNode(role, content) {
      const isUser = role === 'user';
      const wrapper = document.createElement('div');
      wrapper.className = `flex gap-3 md:gap-4 ${isUser ? 'justify-end' : 'justify-start'}`;

      const innerContent = isUser 
        ? `<div class="bg-gray-200 dark:bg-geminiInputDark text-gray-900 dark:text-gray-100 px-4 py-3 rounded-2xl max-w-[85%] text-sm md:text-base leading-relaxed whitespace-pre-wrap">${escapeHtml(content)}</div>`
        : `<div class="flex gap-3 max-w-[90%]">
             <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-purple-500 via-pink-500 to-blue-500 flex items-center justify-center text-white font-bold text-xs shrink-0 mt-1">✦</div>
             <div class="prose dark:prose-invert max-w-none text-sm md:text-base leading-relaxed overflow-hidden text-gray-800 dark:text-gray-200 markdown-body">${parseMarkdown(content)}</div>
           </div>`;

      wrapper.innerHTML = innerContent;
      return wrapper;
    }

    // Input Handling
    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleFormSubmit(e);
      }
    }

    function autoResizeTextarea(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 192) + 'px';
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      if (isGenerating) return;

      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      if (!appState.apiKey) {
        alert('Please enter your OpenRouter API key in Settings.');
        openSettingsModal();
        return;
      }

      const currentChat = appState.chats.find(c => c.id === appState.currentChatId);
      if (!currentChat) return;

      // Auto title for initial prompt
      if (currentChat.messages.length === 0) {
        currentChat.title = text.length > 25 ? text.substring(0, 25) + '...' : text;
        renderSidebar();
      }

      // Add user message
      currentChat.messages.push({ role: 'user', content: text });
      input.value = '';
      autoResizeTextarea(input);
      renderMessages();

      // Create AI Response Node for streaming
      const container = document.getElementById('messagesContainer');
      const aiWrapper = createMessageNode('assistant', '');
      container.appendChild(aiWrapper);
      const markdownContainer = aiWrapper.querySelector('.markdown-body');

      isGenerating = true;
      document.getElementById('sendBtn').disabled = true;

      let fullResponse = '';

      try {
        const messagesPayload = [];
        if (appState.systemPrompt) {
          messagesPayload.push({ role: 'system', content: appState.systemPrompt });
        }
        currentChat.messages.forEach(m => messagesPayload.push({ role: m.role, content: m.content }));

        const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${appState.apiKey}`,
            'Content-Type': 'application/json',
            'HTTP-Referer': window.location.href,
            'X-Title': 'Aura AI Chat'
          },
          body: JSON.stringify({
            model: appState.model,
            messages: messagesPayload,
            stream: true
          })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error?.message || `HTTP ${response.status}: Response failed`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop(); // Keep incomplete line in buffer

          for (const line of lines) {
            const trimmed = line.trim();
            if (trimmed.startsWith('data: ')) {
              const dataStr = trimmed.replace(/^data:\s*/, '');
              if (dataStr === '[DONE]') break;

              try {
                const json = JSON.parse(dataStr);
                const delta = json.choices[0]?.delta?.content || '';
                fullResponse += delta;
                markdownContainer.innerHTML = parseMarkdown(fullResponse);
                scrollToBottom();
              } catch (err) {
                // Ignore chunk parse errors
              }
            }
          }
        }

        currentChat.messages.push({ role: 'assistant', content: fullResponse });
        saveState();

      } catch (error) {
        console.error('Streaming Error:', error);
        markdownContainer.innerHTML = `<span class="text-red-500 font-semibold">Error: ${escapeHtml(error.message)}</span>`;
      } finally {
        isGenerating = false;
        document.getElementById('sendBtn').disabled = false;
      }
    }

    // Helpers
    function parseMarkdown(text) {
      if (typeof marked !== 'undefined') {
        try {
          return marked.parse(text);
        } catch (e) {
          return escapeHtml(text);
        }
      }
      return escapeHtml(text);
    }

    function escapeHtml(str) {
      return (str || '')
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function scrollToBottom() {
      const container = document.getElementById('messagesContainer');
      container.scrollTop = container.scrollHeight;
    }
  </script>
</body>
</html>
